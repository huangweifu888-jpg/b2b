version: 1
profile: 04-server
serverCount: 4
roleDefinitionsRoot: deployment/role-definitions
releaseFlow: deployment/common/global-release-flow.yaml
sourcePolicy: one-source-no-role-copies
purpose: 将公网入口与应用内网分开
external_backup_required: true
servers:
  - id: SERVER-01-CONTROL-RUNTIME
    roles: ["01", "02", "03"]
    summary: 总部、双源和三类业务运行端。
  - id: SERVER-02-WORKER
    roles: ["04"]
    summary: 素材、构建、发布和异步任务。
  - id: SERVER-03-EDGE
    roles: ["05"]
    summary: 唯一公网入口、HTTPS、域名和观测。
  - id: SERVER-04-DATA
    roles: ["06"]
    summary: PostgreSQL、Redis和对象存储。
